name: iOS TestFlight

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-14
    timeout-minutes: 90
    env:
      BUNDLE_ID: ua.demo.fakedia
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install npm deps
        run: npm ci || npm install

      - name: Prepare www + Capacitor iOS
        run: |
          npm run build:web
          if [ ! -d ios ]; then
            npx cap add ios
          fi
          npx cap sync ios
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" ios/App/App/Info.plist
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/g" ios/App/App.xcodeproj/project.pbxproj
          BUILD_NUM=$(date +%Y%m%d%H%M)
          MARKETING="1.0.$BUILD_NUM"
          echo "BUILD_NUM=$BUILD_NUM" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $MARKETING" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" ios/App/App/Info.plist || true
          sed -i '' "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = $MARKETING;/g" ios/App/App.xcodeproj/project.pbxproj
          sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = $BUILD_NUM;/g" ios/App/App.xcodeproj/project.pbxproj
          echo "Marketing $MARKETING build $BUILD_NUM"

      - name: CocoaPods
        run: |
          cd ios/App
          pod install

      - name: Install Codemagic CLI tools
        run: pip3 install codemagic-cli-tools

      - name: Keychain + signing
        run: |
          export PATH="$(python3 -m site --user-base)/bin:$PATH"
          mkdir -p "$HOME/private_keys" private_keys
          printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8"
          cp "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8" private_keys/
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY
          keychain add-certificates
          xcode-project use-profiles

      - name: Build IPA
        run: |
          export PATH="$(python3 -m site --user-base)/bin:$PATH"
          cd ios/App
          xcode-project build-ipa --workspace App.xcworkspace --scheme App

      - name: Upload to TestFlight
        run: |
          IPA=$(ls ios/App/build/ios/ipa/*.ipa | head -n1)
          echo "Uploading $IPA (build $BUILD_NUM)"
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8"
          xcrun altool --upload-app --type ios \
            --file "$IPA" \
            --apiKey "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Assign External + wait processing
        run: |
          pip3 install PyJWT cryptography
          python3 scripts/assign_external_tf.py
