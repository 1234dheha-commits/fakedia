workflows:
  android-debug:
    name: Fakedia Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22
      java: 21
      vars:
        PACKAGE_NAME: ua.demo.fakedia
    scripts:
      - name: Install npm deps
        script: |
          npm ci || npm install
      - name: Prepare www + sync Capacitor Android
        script: |
          npm run build:web
          if [ ! -d android ]; then
            npx cap add android
          fi
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          npx cap sync android
      - name: Build debug APK
        script: |
          java -version
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
    publishing:
      email:
        recipients:
          - jfdheha@gmail.com
        notify:
          success: true
          failure: true

  ios-release:
    name: Fakedia iOS IPA
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      groups:
        - code_signing
      node: 22
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: ua.demo.fakedia
        XCODE_WORKSPACE: App.xcworkspace
        XCODE_SCHEME: App
    scripts:
      - name: Install npm deps
        script: |
          npm ci || npm install
      - name: Prepare www + add/sync iOS
        script: |
          npm run build:web
          if [ ! -d ios ]; then
            npx cap add ios
          fi
          npx cap sync ios
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" ios/App/App/Info.plist || true
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/g" ios/App/App.xcodeproj/project.pbxproj
      - name: CocoaPods
        script: |
          cd ios/App
          pod install
      - name: Keychain + signing files
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          cd ios/App
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
      email:
        recipients:
          - jfdheha@gmail.com
        notify:
          success: true
          failure: true
